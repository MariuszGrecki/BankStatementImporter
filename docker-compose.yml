name: bank-statement-importer

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bank_importer
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: secret
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank_importer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  seaweedfs-init:
    image: amazon/aws-cli
    depends_on:
      - seaweedfs
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: bank-dev-key
      AWS_SECRET_ACCESS_KEY: bank-dev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket bank-statements 2>/dev/null \
           || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://bank-statements; do
          echo "czekam na SeaweedFS..."; sleep 2
        done
        echo "bucket bank-statements gotowy"

  api:
    build:
      context: ./api
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "${API_PORT:-18000}:8000"
    environment:
      FRONTEND_URL: http://${PUBLIC_HOST:-localhost}:${WEB_PORT:-15173}
    volumes:
      - ./api:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-15173}:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://${PUBLIC_HOST:-localhost}:${API_PORT:-18000}

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  api_vendor:
  web_node_modules:
